name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: AparkApp-pub

    steps:
      - name: Query keepalive table
        run: |
          curl --fail -s \
          -X GET "https://nvwucveezbnxcflnhzzi.supabase.co/rest/v1/keepalive?select=id&limit=1" \
          -H "apikey: ${{ secrets.API_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.TOKEN }}"

      - name: Ping Storage bucket
        run: |
          curl --fail -s \
          -X POST "https://nvwucveezbnxcflnhzzi.supabase.co/storage/v1/object/list/archivos" \
          -H "apikey: ${{ secrets.API_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"prefix": ""}'
