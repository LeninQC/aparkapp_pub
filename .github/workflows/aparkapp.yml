name: Keep Supabase Alive

on:
  schedule:
    # Cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: AparkApp-pub

    steps:
      - name: Insert keepalive row
        run: |
          curl -s \
          -X POST "https://nvwucveezbnxcflnhzzi.supabase.co/rest/v1/keepalive" \
          -H "apikey: ${{ secrets.API_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.TOKEN }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: return=minimal" \
          -d '{}'

      - name: Ping Storage bucket
        run: |
          curl -s \
          -X POST "https://nvwucveezbnxcflnhzzi.supabase.co/storage/v1/object/list/archivos" \
          -H "apikey: ${{ secrets.API_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"prefix": ""}'
